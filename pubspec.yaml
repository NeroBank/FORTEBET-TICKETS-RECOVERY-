name: fortbet_ticket_recovery
description: Local-first ForteBet ticket capture and collection tracking app.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/fortebet_football.png
  adaptive_icon_background: '#101116'
  adaptive_icon_foreground: assets/fortebet_football.png

flutter:
  uses-material-design: true
  assets:
    - assets/fortebet_football.png
